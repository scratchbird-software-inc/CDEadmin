name: Native development environments

on:
  workflow_dispatch:
  push:
    branches: ['codex/native-dev-*']

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / CPython 3.14
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      # Repository policy permits local actions only. These ordinary shell
      # steps intentionally have no dependency on marketplace actions.
      - name: Capture the exact source revision
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin $env:SOURCE_URL
          git fetch --depth=1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native host inventory
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.platform()); print(platform.machine())"
          node --version
          git --version
      - name: Install the standard native Python toolchain
        run: |
          python -m pip install uv==0.13.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m uv python install 3.14
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Provision and qualify the development environment
        env:
          CDEADMIN_NATIVE_EVIDENCE: ${{ runner.temp }}/cdeadmin-native-evidence
          SCRATCHROBIN_DDN_SOURCE: ${{ runner.temp }}/Diagram-Design-Notation
          SCRATCHROBIN_DDN_WORK: ${{ runner.temp }}/ddn-intake
        run: |
          git clone https://github.com/scratchbird-software-inc/Diagram-Design-Notation.git $env:SCRATCHROBIN_DDN_SOURCE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location $env:SCRATCHROBIN_DDN_SOURCE
          npm ci --ignore-scripts
          $dependencyExit = $LASTEXITCODE
          Pop-Location
          if ($dependencyExit) { exit $dependencyExit }
          python -m uv run --no-project --python 3.14 python tools/development/native.py ci --evidence $env:CDEADMIN_NATIVE_EVIDENCE
          exit $LASTEXITCODE
      - name: Publish failure inventory to the job summary
        if: always()
        run: |
          $receipt = Join-Path '${{ runner.temp }}' 'cdeadmin-native-evidence/summary.md'
          if (Test-Path $receipt) { Get-Content $receipt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          else { 'Native environment did not reach qualification; inspect preceding setup logs.' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
