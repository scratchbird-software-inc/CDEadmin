name: Native development environments

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON runner list; default qualifies all three native hosts'
        required: true
        default: '["windows-2025", "macos-15-intel", "macos-15"]'
      stages:
        description: 'CI stages; subsets are targeted runs, not full acceptance'
        required: true
        default: 'prerequisites,doctor,clients,python,servers,frontend,desktop,verify,fixtures'
  push:
    branches: [master]
    paths: ['web/**', 'runtime/**', 'tools/**', 'requirements.txt', '.github/workflows/native-development.yml', '.github/actions/native-evidence/**']
  pull_request:
    branches: [master]
    paths: ['web/**', 'runtime/**', 'tools/**', 'requirements.txt', '.github/workflows/native-development.yml', '.github/actions/native-evidence/**']

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.os }} / CPython 3.14
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["windows-2025", "macos-15-intel", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 180 || 360 }}
    defaults:
      run:
        shell: pwsh
    steps:
      # Repository policy permits local actions only. These ordinary shell
      # steps intentionally have no dependency on marketplace actions.
      - name: Capture the exact source revision
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git config core.autocrlf false
          git remote add origin $env:SOURCE_URL
          git fetch --depth=1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native host inventory
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.platform()); print(platform.machine())"
          node --version
          git --version
      - name: Install the standard native Python toolchain
        run: |
          python -m pip install uv==0.13.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m uv python install 3.14
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Provision and qualify the development environment
        env:
          CDEADMIN_NATIVE_EVIDENCE: ${{ runner.temp }}/cdeadmin-native-evidence
          SCRATCHROBIN_DDN_SOURCE: ${{ runner.temp }}/ScratchWeaver
          SCRATCHROBIN_DDN_WORK: ${{ runner.temp }}/ddn-intake
          CDEADMIN_DDN_SOURCE_URL: ${{ vars.CDEADMIN_DDN_SOURCE_URL }}
          NATIVE_STAGES: ${{ inputs.stages || 'prerequisites,doctor,clients,python,servers,frontend,desktop,verify,fixtures' }}
        run: |
          $ddn = Get-Content 'web/pgadmin/static/vendor/ddn/current/resource-manifest.json' -Raw | ConvertFrom-Json
          if (-not $env:CDEADMIN_DDN_SOURCE_URL) { throw 'Configure an authorized ddn-next-1 source. The obsolete public DDN repository is not a fallback.' }
          git -c core.autocrlf=false clone $env:CDEADMIN_DDN_SOURCE_URL $env:SCRATCHROBIN_DDN_SOURCE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location $env:SCRATCHROBIN_DDN_SOURCE
          git config core.autocrlf false
          git checkout --detach $ddn.source.revision
          if ($LASTEXITCODE) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location
          # The intake provisions exact native tools in runner-owned evidence.
          python -m uv run --no-project --python 3.14 python tools/development/native.py ci --evidence $env:CDEADMIN_NATIVE_EVIDENCE --stages $env:NATIVE_STAGES
          exit $LASTEXITCODE
      - name: Qualify configured disposable network engines
        if: ${{ !cancelled() && vars.CDEADMIN_NATIVE_ROUTES_JSON != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          ROUTES_JSON: ${{ vars.CDEADMIN_NATIVE_ROUTES_JSON }}
          CDEADMIN_TEST_POSTGRES_PASSWORD: ${{ secrets.CDEADMIN_TEST_POSTGRES_PASSWORD }}
          CDEADMIN_TEST_FIREBIRD_PASSWORD: ${{ secrets.CDEADMIN_TEST_FIREBIRD_PASSWORD }}
          CDEADMIN_TEST_MYSQL_PASSWORD: ${{ secrets.CDEADMIN_TEST_MYSQL_PASSWORD }}
          CDEADMIN_TEST_MARIADB_PASSWORD: ${{ secrets.CDEADMIN_TEST_MARIADB_PASSWORD }}
        run: |
          $env:CDEADMIN_NATIVE_ROUTES = Join-Path '${{ runner.temp }}' 'native-routes.json'
          [System.IO.File]::WriteAllText($env:CDEADMIN_NATIVE_ROUTES, $env:ROUTES_JSON)
          $env:SCRATCHROBIN_DDN_SOURCE = Join-Path '${{ runner.temp }}' 'ScratchWeaver'
          $env:SCRATCHROBIN_DDN_WORK = Join-Path '${{ runner.temp }}' 'ddn-intake'
          python -m uv run --no-project --python 3.14 python tools/development/native.py network --evidence '${{ runner.temp }}/cdeadmin-native-network'
          exit $LASTEXITCODE
      - name: Publish failure inventory to the job summary
        if: always()
        run: |
          $receipt = Join-Path '${{ runner.temp }}' 'cdeadmin-native-evidence/summary.md'
          if (Test-Path $receipt) { Get-Content $receipt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          else { 'Native environment did not reach qualification; inspect preceding setup logs.' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
      - name: Prepare the repository evidence uploader
        if: always()
        run: |
          npm ci --ignore-scripts --prefix .github/actions/native-evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test .github/actions/native-evidence/test.cjs
          exit $LASTEXITCODE
      - name: Preserve native evidence
        if: always()
        uses: ./.github/actions/native-evidence
        with:
          path: ${{ runner.temp }}/cdeadmin-native-evidence
          name: native-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
